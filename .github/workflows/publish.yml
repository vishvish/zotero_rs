name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  checks: read

jobs:
  verify-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure CI and Security succeeded for tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          required_checks=("CI" "Security")
          deadline=$((SECONDS + 1800))

          while true; do
            json=$(gh api -H "Accept: application/vnd.github+json" "/repos/$REPO/commits/$SHA/check-runs?per_page=100")
            all_ready=true

            for check_name in "${required_checks[@]}"; do
              status=$(echo "$json" | jq -r --arg name "$check_name" '
                [.check_runs[] | select(.name == $name)]
                | sort_by(.started_at // .created_at)
                | last
                | .status // "missing"
              ')
              conclusion=$(echo "$json" | jq -r --arg name "$check_name" '
                [.check_runs[] | select(.name == $name)]
                | sort_by(.started_at // .created_at)
                | last
                | .conclusion // "missing"
              ')

              if [ "$status" = "missing" ]; then
                echo "Check '$check_name' not found for tagged commit yet."
                all_ready=false
                continue
              fi

              if [ "$status" != "completed" ]; then
                echo "Check '$check_name' status: $status"
                all_ready=false
                continue
              fi

              if [ "$conclusion" != "success" ]; then
                echo "Check '$check_name' concluded with '$conclusion'. Refusing publish."
                exit 1
              fi

              echo "Check '$check_name' passed."
            done

            if [ "$all_ready" = true ]; then
              break
            fi

            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "Timed out waiting for required checks."
              exit 1
            fi

            sleep 15
          done

  verify:
    runs-on: ubuntu-latest
    needs: verify-checks
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Publish dry-run
        run: cargo publish --dry-run --locked --all-features

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --all-features
